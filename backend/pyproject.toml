[project]
name = "agile-pm-tool-backend"
version = "0.1.0"
description = "Agile Project Management Tool - Backend API"
requires-python = ">=3.11"

dependencies = [
"fastapi[standard]>=0.115.0",
"sqlalchemy>=2.0.36",
"alembic>=1.14.0",
"pydantic>=2.10.0",
"pydantic-settings>=2.6.0",
"python-dotenv>=1.0.0",
"uvicorn[standard]>=0.32.0",
"aiosqlite>=0.20.0",
"greenlet>=3.1.1",
"python-multipart>=0.0.12",
"celery>=5.4.0",
"redis>=5.2.0",
"flower>=2.0.0",
]

[dependency-groups]
dev = [
"pytest>=8.3.0",
"pytest-asyncio>=0.24.0",
"pytest-cov>=6.0.0",
"httpx>=0.28.0",
"ruff>=0.8.0",
"mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
